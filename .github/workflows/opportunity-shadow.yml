name: Record prospective opportunity TD comparison
on:
  schedule:
    - cron: '0 16 * * 4' # Thursday noon EDT / 11am EST, before the weekly opener
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-atd-forward-v1
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline capture logic
        run: python -m unittest discover -s tests -p 'test_opportunity_shadow.py' -v
      - name: Capture from existing public snapshots only
        # No downloads/provider credentials, no alerts, no model promotion.
        run: python scripts/opportunity_shadow.py
      - name: Preserve immutable research receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name goinglong-bot
          git config user.email actions@github.com
          git add -- data/opportunity_shadow/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "research: capture prospective opportunity TD comparison"
          # Refuse concurrency replay; retry only from current main before kickoff.
          git push origin HEAD:main
      - name: Preserve public research capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-atd-forward-v1
          path: data/opportunity_shadow/
          if-no-files-found: ignore
          retention-days: 90
