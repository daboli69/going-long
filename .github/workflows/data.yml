name: Refresh Going Long data
on:
  schedule:
    - cron: '20 10,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: refresh-going-long-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEASON: '2026'
      TEAMS: '12'
      SCORING: ppr
      NUM_QBS: '1'
      HISTORY_SEASONS: '3'
      PROJECTION_WINDOW: '12'
      PROJECTION_MIN_GAMES: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Validate model logic
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build fantasy pool and formats
        id: pool
        continue-on-error: true
        run: python scripts/build_data.py
      - name: Build fantasy history
        id: history
        continue-on-error: true
        run: python scripts/build_history.py
      - name: Build NFL odds
        id: nfl
        continue-on-error: true
        run: python scripts/build_nfl_betting.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      - name: Build NCAA odds
        id: ncaa
        continue-on-error: true
        run: python scripts/build_ncaa_lines.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      - name: Build historical projections and name matches
        id: projections
        continue-on-error: true
        run: python scripts/build_pipeline.py
      - name: Build and grade Thursday longest touchdown research
        id: jackpot
        continue-on-error: true
        run: python scripts/king_endzone.py
      - name: Build and grade Slate Breaker research
        id: slate_breaker
        continue-on-error: true
        run: python scripts/slate_breaker.py
      - name: Build football opportunity and coaching context
        id: context
        continue-on-error: true
        run: python scripts/football_context.py
      - name: Refresh chronological NFL game-model diagnostic
        id: game_validation
        continue-on-error: true
        run: python scripts/backtest_nfl_context.py --start 2023 --end 2026
      - name: Extract public Savant context
        run: python scripts/extract_savant.py
      - name: Build settlement observations
        run: python scripts/build_results.py
      - name: Audit current season and build defensive memory
        id: season_learning
        continue-on-error: true
        run: python scripts/season_learning.py
      - name: Commit generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name goinglong-bot
          git config user.email actions@github.com
          paths=(data/king-endzone.json data/slate-breaker.json data/jackpot data/savant_context.json data/football_context.json data/football_role_validation.json data/football_game_validation.json data/season_learning.json data/results.json data/players.json data/formats data/history.json data/data.json data/nfl_betting.json data/ncaa_lines.json)
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          git add -- "${existing[@]}"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          snapshot=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # Reapply only generated files to the latest code. A soft reset
            # would accidentally stage reversions of concurrent source edits.
            git reset --hard origin/main
            git restore --source="$snapshot" --staged --worktree -- "${existing[@]}"
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            sleep "$attempt"
          done
          exit 1
      - name: Report source failures
        if: ${{ steps.pool.outcome == 'failure' || steps.history.outcome == 'failure' || steps.nfl.outcome == 'failure' || steps.ncaa.outcome == 'failure' || steps.projections.outcome == 'failure' || steps.context.outcome == 'failure' || steps.game_validation.outcome == 'failure' || steps.season_learning.outcome == 'failure' || steps.jackpot.outcome == 'failure' || steps.slate_breaker.outcome == 'failure' }}
        run: |
          echo 'A data source failed. Successful snapshots were committed; inspect the failed step.'
          exit 1
