name: Refresh Going Long data
on:
  schedule:
    - cron: '20 10,22 * * *'
    - cron: '20 8 * * 0'   # Sunday pregame: a second chance to write the write-once freeze before the 9:30 ET kickoffs
    - cron: '45 15 * * 0'  # Sunday: fresh injury/practice data ahead of the 1:00 ET window
    - cron: '5 19 * * 0'   # Sunday: fresh injury/practice data ahead of the 4:05/4:25 ET window
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: refresh-going-long-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEASON: '2026'
      TEAMS: '12'
      SCORING: ppr
      NUM_QBS: '1'
      HISTORY_SEASONS: '3'
      PROJECTION_WINDOW: '12'
      PROJECTION_MIN_GAMES: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          npm ci
      - name: Validate model logic
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build fantasy pool and formats
        id: pool
        continue-on-error: true
        run: python scripts/build_data.py
      - name: Build fantasy history
        id: history
        continue-on-error: true
        run: python scripts/build_history.py
      - name: Build GOING Score v2 player situation index
        id: going_score
        continue-on-error: true
        # Public nflverse/ffopportunity data only; display-only index (not a projection or edge). Needs the history build above.
        run: python scripts/going_score_build.py --cache "$RUNNER_TEMP/going-score-cache"
      - name: Build NFL odds
        id: nfl
        continue-on-error: true
        run: python scripts/build_nfl_betting.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      - name: Build NCAA odds
        id: ncaa
        continue-on-error: true
        run: python scripts/build_ncaa_lines.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      - name: Build historical projections and name matches
        id: projections
        continue-on-error: true
        run: python scripts/build_pipeline.py
      - name: Build and grade Thursday longest touchdown research
        id: jackpot
        continue-on-error: true
        run: python scripts/king_endzone.py
      - name: Build and grade Slate Breaker research
        id: slate_breaker
        continue-on-error: true
        run: python scripts/slate_breaker.py
      - name: Build football opportunity and coaching context
        id: context
        continue-on-error: true
        run: python scripts/football_context.py
      - name: Build historical injury effects and current replacement roles
        id: injury_context
        continue-on-error: true
        run: python scripts/injury_context.py
      - name: Publish all-position active roster
        id: roster_public
        continue-on-error: true
        run: python scripts/build_roster.py
      - name: Refresh chronological NFL game-model diagnostic
        id: game_validation
        continue-on-error: true
        run: python scripts/backtest_nfl_context.py --start 2023 --end 2026
      - name: Extract public Savant context
        run: python scripts/extract_savant.py
      - name: Build settlement observations
        if: ${{ !cancelled() }}
        run: python scripts/build_results.py
      - name: Audit current season and build defensive memory
        id: season_learning
        continue-on-error: true
        run: python scripts/season_learning.py
      - name: Freeze and settle public performance tracker
        id: tracker
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node scripts/build_public_tracker.mjs
      - name: Build Charts data files (public nflverse, history and settled tracker; aggregate only)
        id: charts
        continue-on-error: true
        if: ${{ !cancelled() }}
        # After history and the tracker are built. Public data only; a failed source keeps that file's previous snapshot.
        run: python scripts/charts_build.py --cache-dir "$RUNNER_TEMP/charts-cache"
      - name: Build derived Validation light ledger
        id: validation_ledger
        continue-on-error: true
        if: ${{ !cancelled() }}
        # UI projection of the canonical tracker store; never an input to the tracker, calibration or audits.
        run: node scripts/validation_ledger.mjs build
      - name: Publish static opportunities and multisport signal journal
        id: consumer_data
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node scripts/build_consumer_data.mjs
      - name: Settle TD shadow and write the pregame freeze manifest
        id: freeze
        continue-on-error: true
        if: ${{ !cancelled() }}
        # Public data only. The freeze is write-once and only written before the first kickoff of the day.
        run: |
          python scripts/sunday_freeze.py "$(date -u +%F)"
          python scripts/td_shadow.py settle || echo 'td shadow settle skipped'
          python scripts/nb_shadow.py settle || echo 'nb shadow settle skipped'
      - name: Commit generated snapshots
        if: ${{ !cancelled() }}
        # Every consumer feature is a static artifact; no database or service added.
        shell: bash
        run: |
          set -euo pipefail
          git config user.name goinglong-bot
          git config user.email actions@github.com
          paths=(data/public_tracker.json data/public_tracker data/derived data/king-endzone.json data/slate-breaker.json data/jackpot data/savant_context.json data/football_context.json data/injury_context.json data/football_role_validation.json data/football_game_validation.json data/season_learning.json data/results.json data/players.json data/formats data/history.json data/going_score.json data/data.json data/nfl_betting.json data/ncaa_lines.json)
          paths+=(data/charts data/nfl_roster.json data/opportunities.json data/signal_tracker.json data/signal_archive data/freezes data/td_shadow data/role_shadow data/nb_shadow)
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          git add -- "${existing[@]}"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          snapshot=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            # Reapply only generated files to the latest code. A soft reset
            # would accidentally stage reversions of concurrent source edits.
            git reset --hard origin/main
            git restore --source="$snapshot" --staged --worktree -- "${existing[@]}"
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            sleep "$attempt"
          done
          exit 1
      - name: Report source failures
        if: ${{ steps.pool.outcome == 'failure' || steps.history.outcome == 'failure' || steps.nfl.outcome == 'failure' || steps.ncaa.outcome == 'failure' || steps.projections.outcome == 'failure' || steps.context.outcome == 'failure' || steps.injury_context.outcome == 'failure' || steps.game_validation.outcome == 'failure' || steps.season_learning.outcome == 'failure' || steps.jackpot.outcome == 'failure' || steps.slate_breaker.outcome == 'failure' || steps.tracker.outcome == 'failure' || steps.validation_ledger.outcome == 'failure' || steps.roster_public.outcome == 'failure' || steps.consumer_data.outcome == 'failure' || steps.charts.outcome == 'failure' || steps.going_score.outcome == 'failure' || steps.freeze.outcome == 'failure' }}
        run: |
          echo 'A data source failed. Successful snapshots were committed; inspect the failed step.'
          exit 1
