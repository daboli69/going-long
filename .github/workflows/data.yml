name: Refresh Going Long data
on:
  schedule:
    - cron: '20 10,22 * * *'
    - cron: '5 21 * * 1'   # Monday: pre-MNF availability and longest-TD forecast; daily refresh also runs
    - cron: '20 8,9 * * 0' # 04:20 Eastern in EDT/EST; the script guards early/duplicate runs
    - cron: '5 12 * * 0'   # Sunday: inactives for the 9:30 ET game are out about 90 minutes before kickoff (12:00Z)
    - cron: '45 15 * * 0'  # Sunday: fresh injury/practice data ahead of the 1:00 ET window
    - cron: '5 19 * * 0'   # Sunday: fresh injury/practice data ahead of the 4:05/4:25 ET window
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: refresh-going-long-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEASON: '2026'
      TEAMS: '12'
      SCORING: ppr
      NUM_QBS: '1'
      HISTORY_SEASONS: '3'
      PROJECTION_WINDOW: '12'
      PROJECTION_MIN_GAMES: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          # ABBEYS verifies immutable receipts against their original Git commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          npm ci
      - name: Validate model logic
        id: validate_models
        continue-on-error: true
        # Diagnostics only; mutable production-snapshot tests must not deadlock refresh.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate stable projection logic
        id: validate_projection_logic
        continue-on-error: true
        # Offline logic regressions control model outputs separately from mutable snapshot diagnostics.
        run: |
          python -m unittest discover -s tests -p 'test_derivatives.py' -v
          python -m unittest discover -s tests -p 'test_champion_policy.py' -v
      - name: Build fantasy pool and formats
        id: pool
        continue-on-error: true
        run: python scripts/build_data.py
      - name: Build fantasy history
        id: history
        continue-on-error: true
        run: python scripts/build_history.py
      - name: Build NFL odds
        id: nfl
        continue-on-error: true
        run: python scripts/build_nfl_betting.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          # Approved within owner's 20,000/month allowance; scope this to the
          # real builder, not unit tests or other consumers. Nine single pages.
          PARLAY_PROPS_PARTITIONS: markets
      - name: Build NCAA odds
        id: ncaa
        continue-on-error: true
        run: python scripts/build_ncaa_lines.py
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      - name: Build football opportunity and coaching context
        id: context
        continue-on-error: true
        run: python scripts/football_context.py
      - name: Build historical injury effects and current replacement roles
        id: injury_context
        continue-on-error: true
        run: python scripts/injury_context.py
        env:
          NFLMETA_API_KEY: ${{ secrets.NFLMETA_API_KEY }}
      - name: Publish all-position active roster
        id: roster_public
        continue-on-error: true
        run: python scripts/build_roster.py
        env:
          NFLMETA_API_KEY: ${{ secrets.NFLMETA_API_KEY }}
      - name: Build historical projections and name matches
        id: projections
        continue-on-error: true
        run: python scripts/build_pipeline.py
      - name: Build GOING Score v2 player situation index
        id: going_score
        continue-on-error: true
        # Consume this run's history, context, injuries and roster; never yesterday's availability by step order.
        run: python scripts/going_score_build.py --cache "$RUNNER_TEMP/going-score-cache"
      - name: Build and grade Monday longest touchdown research
        id: jackpot
        continue-on-error: true
        run: python scripts/king_endzone.py
      - name: Build and grade Slate Breaker research
        id: slate_breaker
        continue-on-error: true
        run: python scripts/slate_breaker.py
      - name: Refresh chronological NFL game-model diagnostic
        id: game_validation
        continue-on-error: true
        run: python scripts/backtest_nfl_context.py --start 2023 --end 2026
      - name: Extract public Savant context
        id: savant
        continue-on-error: true
        run: python scripts/extract_savant.py
      - name: Build settlement observations
        id: results
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: python scripts/build_results.py
      - name: Build DFS team touchdown budgets (Touchdown Throne)
        id: dfs_team_td
        continue-on-error: true
        # Fail-closed and atomic; the consumer rejects any snapshot older than 36 hours, so a failure here disables Throne instead of serving stale data.
        run: python scripts/dfs_team_touchdowns.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build current-season Showdown kicker evidence
        id: dfs_kickers
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: python scripts/dfs_kickers.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Audit current season and build defensive memory
        id: season_learning
        continue-on-error: true
        run: python scripts/season_learning.py
      - name: Freeze and settle public performance tracker
        id: tracker
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node scripts/build_public_tracker.mjs
      - name: Build Charts data files (public nflverse, history and settled tracker; aggregate only)
        id: charts
        continue-on-error: true
        if: ${{ !cancelled() }}
        # After history and the tracker are built. Public data only; a failed source keeps that file's previous snapshot.
        run: python scripts/charts_build.py --cache-dir "$RUNNER_TEMP/charts-cache"
      - name: Build derived Validation light ledger
        id: validation_ledger
        continue-on-error: true
        if: ${{ !cancelled() }}
        # UI projection of the canonical tracker store; never an input to the tracker, calibration or audits.
        run: node scripts/validation_ledger.mjs build
      - name: Publish static opportunities and multisport signal journal
        id: consumer_data
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node scripts/build_consumer_data.mjs
      - name: Snapshot GOING game-line model rows for Missions cross-check
        id: missions_model
        continue-on-error: true
        if: ${{ !cancelled() }}
        # Same production board math over the odds file just built; Missions reads it only as a cross-check and ignores it when stale.
        run: node scripts/build_missions_model.cjs
      - name: Settle TD shadow and write the pregame freeze manifest
        id: freeze
        continue-on-error: true
        if: ${{ !cancelled() }}
        # Public data only. The freeze is write-once and only written before the first kickoff of the day.
        run: |
          status=0
          python scripts/sunday_freeze.py || status=1
          python scripts/td_shadow.py settle || status=1
          python scripts/nb_shadow.py settle || status=1
          exit "$status"
      - name: Materialize immutable ABBEYS boards and current-week status
        id: abbeys_board
        continue-on-error: true
        if: ${{ !cancelled() }}
        # Read-only journal verification; never capture/backfill a missed research origin.
        run: node research/abbeys/collect.cjs materialize .
      - name: Validate changed snapshot integrity
        id: data_integrity
        if: ${{ !cancelled() }}
        env:
          REFRESH_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/refresh_health.py --publication-check --report "$RUNNER_TEMP/publication-integrity.json"
      - name: Commit generated snapshots
        id: publish
        if: ${{ !cancelled() && steps.data_integrity.outcome == 'success' }}
        # Every consumer feature is a static artifact; no database or service added.
        shell: bash
        run: |
          set -euo pipefail
          git config user.name goinglong-bot
          git config user.email actions@github.com
          # Stage only valid changed outputs from successful components. Failed
          # components and malformed/stale new snapshots stay out of the commit.
          mapfile -t publish_paths < <(python -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"publication-integrity.json"; print("\n".join(json.loads(p.read_text())["publication_paths"]))')
          stage_paths=()
          for path in "${publish_paths[@]}"; do
            # Include verified retired tracked shards as well as new outputs.
            # The integrity report authorizes deletions only after checking the replacement index.
            if [ -n "$path" ] && { [ -f "$path" ] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; }; then
              stage_paths+=("$path")
            fi
          done
          if [ "${#stage_paths[@]}" -eq 0 ]; then exit 0; fi
          git add -- "${stage_paths[@]}"
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # One ordinary fast-forward push. If main advances, recompute against
          # the new checkout on the next run; never replay older generated data.
          if ! git push origin HEAD:main; then
            echo 'Publication failed: main advanced or transport failed. Snapshots were not replayed; rerun from current main.' >&2
            exit 1
          fi
      - name: Verify published snapshots reached the public application
        id: public_delivery
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        timeout-minutes: 12
        # Checks only the changed public snapshots, never the paid odds provider.
        run: node scripts/check_public_refresh.mjs "$RUNNER_TEMP/publication-integrity.json"
      - name: Report source failures
        if: ${{ !cancelled() }}
        env:
          REFRESH_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/refresh_health.py --report "$RUNNER_TEMP/refresh-health.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve refresh diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-refresh-health
          path: ${{ runner.temp }}/refresh-health.json
          if-no-files-found: warn
          retention-days: 7
