name: Verify live availability source contract
on:
  push:
    paths:
      - 'scripts/availability_source.py'
      - 'scripts/eligibility.py'
      - 'scripts/nflmeta_source.py'
      - 'scripts/github_release_metadata.py'
      - 'scripts/injury_context.py'
      - 'scripts/check_availability_contract.py'
      - '.github/workflows/availability-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify official release metadata authentication
        run: python -c 'from scripts.github_release_metadata import release_metadata; [print(tag, len(release_metadata(tag)["assets"])) for tag in ("stats_team", "stats_player")]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify source schemas without writing model or journal records
        run: python scripts/check_availability_contract.py
        env:
          SEASON: '2026'
          NFLMETA_API_KEY: ${{ secrets.NFLMETA_API_KEY }}
